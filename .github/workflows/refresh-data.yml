name: Refresh listings and publish site

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: get fresh listing data, save it to the repo, and package the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # If DAHLIA is down or changes shape, this step fails but the site still
      # publishes with the last good data.
      - name: Fetch latest listings
        continue-on-error: true
        run: node scripts/fetch-listings.mjs

      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "bmr-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update listing data"
            # Pick up any site changes pushed while this job was running.
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Job 2: publish. Kept separate (GitHub's recommended layout) so the upload
  # is fully registered before publishing starts.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub's publish step occasionally fails for reasons on GitHub's side.
      # Wait a minute and try once more before reporting a failure.
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
