name: Refresh listings and publish site

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # If DAHLIA is down or changes shape, this step fails but the site still
      # publishes with the last good data.
      - name: Fetch latest listings
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-listings.mjs

      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "bmr-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update listing data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
